<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Chicken Blast</title>
<meta name="theme-color" content="#14110d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ChickenBlast">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/PressStart2P-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face {
    font-family: 'Press Start 2P';
    src: url(fonts/PressStart2P-latin.woff2) format('woff2');
    font-display: block;
  }
  html, body { margin: 0; height: 100%; background: #14110d; overflow: hidden; overscroll-behavior: none; }
  body { display: flex; align-items: center; justify-content: center; -webkit-tap-highlight-color: transparent; }
  canvas { display: block; cursor: none; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script src="core.js"></script>
<script src="worlds.js"></script>
<script src="firebase-config.js"></script>
<script src="highscore.js"></script>
<script src="game.js"></script>
<script>
  if ('serviceWorker' in navigator && window.isSecureContext) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
</script>
</body>
</html>
