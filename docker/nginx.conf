server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types application/javascript application/json application/manifest+json text/css;
    gzip_min_length 1024;

    types {
        application/manifest+json webmanifest;
    }

    # file names are not hashed: always revalidate HTML/JS/manifest so updates arrive at once
    # (sw.js in particular must never be cached, otherwise the service worker never updates)
    location ~* \.(html|js|webmanifest)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # font and icons rarely change
    location ~ ^/(fonts|icons)/ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
